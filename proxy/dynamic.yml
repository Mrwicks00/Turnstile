http:
  routers:
    routerTestnet:
      service: srv-grpc-testnet
      rule: PathPrefix(`/testnet`)
      middlewares:
        - strip-network-prefix
        - "test-grpc-web"
      entryPoints:
        - web

  middlewares:
    test-grpc-web:
      grpcWeb:
        allowOrigins:
          - "*"

    strip-network-prefix:
      stripPrefix:
        prefixes:
          - "/testnet"

  services:
    srv-grpc-testnet:
      loadBalancer:
        servers:
          - url: https://testnet.zec.rocks:443
